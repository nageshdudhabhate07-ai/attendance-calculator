<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Attendance Calculator</title>
<link rel="stylesheet" href="style.css">

</head>
<body>

    <h1>Attendance Calculator</h1>

    <p class="heading">
        Find out the number of days you can bunk while still maintaining 75% attendance
        or the number of days you should attend to attain 75% attendance.
    </p>

    <!-- Form makes Enter key work automatically -->
    <form id="attendanceForm">

        <label for="attendance">Percentage Required</label>
        <select id="attendance">
            <option value="60">60</option>
            <option value="65">65</option>
            <option value="70">70</option>
            <option value="75" selected>75</option>
            <option value="80">80</option>
            <option value="85">85</option>
            <option value="90">90</option>
        </select>

        <br><br>

        <label for="Present-input">Present</label>
        <input type="number" id="Present-input" min="0">

        <br><br>

        <label for="Total-input">Total</label>
        <input type="number" id="Total-input" min="0">
        <br><br>
    </form>
     <br><br>
        <button id="button">Calculate</button>
<p id="result"></p>
    <script src="script.js"></script>
</body>
</html>
